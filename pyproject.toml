[project]
name = "mycol"
version = "0.1.0"
description = "A Streamlit app for cell segmentation and classification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Floor: 1.56 first shipped st.dataframe(selection_default=...).
    # Ceiling: 1.59 only renders a popover's contents while it is open, so button
    # shortcuts inside popovers (B/G/F/E/S/M) stop working unless it is open.
    "streamlit==1.58.0",
    "cellpose>=3.0.0,<4.0.0",
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "opencv-python-headless",  # Lighter than opencv-python
    "scikit-learn==1.5.2",
    "scikit-image==0.25.2",
    "pandas==2.3.2",
    "numpy>=1.26.4",
    "scipy==1.15.3",
    "pillow==10.4.0",
    "plotly==6.3.1",
    "streamlit-image-coordinates==0.4.0",
    "tifffile==2024.9.20",
    # not published on PyPI, so pinned to a commit
    "mobile_sam @ git+https://github.com/ChaoningZhang/MobileSAM.git@f706ad9c4eb7f219c00d9050e46328518ffb65d2",
    "timm>=1.0.0",  # MobileSAM's TinyViT encoder
    "huggingface_hub==1.1.2",
    "kaleido",
    "pywebview>=6.1",
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true


[tool.uv.sources]
torch = [
  { index = "pytorch-cuda", marker = "sys_platform != 'darwin'" },
]
torchvision = [
  { index = "pytorch-cuda", marker = "sys_platform != 'darwin'" },
]



[dependency-groups]
dev = [
    "black",
    "ruff",
]
