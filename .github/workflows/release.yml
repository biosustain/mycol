name: Build Windows release

# Tagging v* publishes the bundles. workflow_dispatch builds them without
# publishing, so the build can be exercised before cutting a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      variant:
        description: "Which bundle(s) to build"
        type: choice
        options: [cpu, cuda, both]
        default: cpu

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      # Each variant gets its own runner: together they exceed the disk a single
      # Windows runner has free, and one failing should not hide the other.
      fail-fast: false
      matrix:
        variant: ${{ (github.event_name == 'push' || inputs.variant == 'both') && fromJSON('["cpu","cuda"]') || fromJSON(format('["{0}"]', inputs.variant)) }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $ref = "${{ github.ref_name }}"
          $version = if ($ref -match '^v(.+)$') { $Matches[1] } else { "0.0.0-dev" }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      - name: Build bundle
        shell: pwsh
        run: |
          ./scripts/make_dist.ps1 -Version "${{ steps.version.outputs.version }}" -Variant "${{ matrix.variant }}"

      - name: Verify bundle layout
        shell: pwsh
        run: ./scripts/verify_dist.ps1 -DistDir "dist/mycol-windows-${{ matrix.variant }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mycol-windows-${{ matrix.variant }}
          path: dist/*.zip
          retention-days: 14

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          draft: true
          generate_release_notes: true
          body: |
            ## Download

            **Most users want `mycol-windows-cpu-v${{ steps.version.outputs.version }}.zip`.**
            Unzip it anywhere and double-click `mycol.exe`. No Python, pip, uv or
            git needed.

            Pick the `cuda` build only if the machine has an NVIDIA GPU — it is
            around 2.5 GB larger and needs a driver supporting CUDA 12.6.

            Windows will warn that it "protected your PC" because these builds
            are not code-signed. Choose **More info → Run anyway**.
