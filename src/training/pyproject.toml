[project]
name = "mycol-training"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "cellpose==3.1.1",
    "torch>=2.5.1,<2.10",
    "torchvision<0.25",
    "numpy>=1.26.4,<2.0.0",
    "scipy",
    "scikit-learn",
    "tqdm",
    "optuna>=4.6.0",
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true


# Mirrors the root pyproject: CPU wheels by default, CUDA as an explicit overlay.
[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform != 'darwin'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform != 'darwin'" },
]

[dependency-groups]
dev = [
    "pyinstaller>=6.17.0",
]

