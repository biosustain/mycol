[project]
name = "mycol-training"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "cellpose==3.1.1",
    "torch>=2.5.1,<2.10",
    "torchvision<0.25",
    "numpy>=1.26.4,<2.0.0",
    "scipy",
    "scikit-learn",
    "tqdm",
    "optuna>=4.6.0",
]

# torchvision publishes a `+d801a34` local build that exists ONLY as a win_arm64
# wheel, and local versions sort alphabetically, so `d801a34` outranks `cpu`.
# Without pinning down the platforms we actually ship to, uv picks that build for
# all of Windows and the install then fails on win_amd64 with "no wheels with a
# matching platform tag". Naming the real targets forces a wheel to exist for each.
[tool.uv]
required-environments = [
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true


# Mirrors the root pyproject: CPU wheels by default, CUDA as an explicit overlay.
[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform != 'darwin'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform != 'darwin'" },
]

[dependency-groups]
dev = [
    "pyinstaller>=6.17.0",
]

