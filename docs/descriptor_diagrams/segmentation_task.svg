<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="297"
   height="172"
   viewBox="0 0 297 172"
   version="1.1"
   id="svg-segmentation-task"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <g id="layer1">

    <!-- ══ panel titles ══ -->
    <text x="74" y="14" style="font-size:9px;font-family:sans-serif;text-anchor:middle;fill:#000000"
       id="seg-title-a">Input image</text>
    <text x="223" y="14" style="font-size:9px;font-family:sans-serif;text-anchor:middle;fill:#000000"
       id="seg-title-b">Cells with masks</text>

    <!-- ══ PANEL A: the raw image ══ -->
    <rect x="10" y="22" width="128" height="112"
       style="fill:#ffffff;stroke:#000000;stroke-width:1.2" id="seg-frame-a" />

    <ellipse cx="46" cy="56" rx="20" ry="13.5" transform="rotate(-18,46,56)"
       style="fill:#94a3b8;fill-opacity:0.30;stroke:#000000;stroke-width:0.9" id="seg-a1" />
    <ellipse cx="92" cy="50" rx="17" ry="12" transform="rotate(22,92,50)"
       style="fill:#94a3b8;fill-opacity:0.30;stroke:#000000;stroke-width:0.9" id="seg-a2" />
    <ellipse cx="102" cy="68" rx="17" ry="12" transform="rotate(-26,102,68)"
       style="fill:#94a3b8;fill-opacity:0.30;stroke:#000000;stroke-width:0.9" id="seg-a3" />
    <ellipse cx="54" cy="100" rx="19" ry="13" transform="rotate(8,54,100)"
       style="fill:#94a3b8;fill-opacity:0.30;stroke:#000000;stroke-width:0.9" id="seg-a4" />

    <!-- ══ arrow ══ -->
    <path d="M 141,78 H 150.5" style="stroke:#000000;stroke-width:1.5;fill:none" id="seg-arrow-line" />
    <path d="M 156,78 148.5,74.6 148.5,81.4 Z" style="fill:#000000;stroke:none" id="seg-arrow-head" />

    <!-- ══ PANEL B: one mask per cell ══ -->
    <!-- shared "masked cell" cue: thick outline + light fill, matching the other diagrams -->
    <rect x="159" y="22" width="128" height="112"
       style="fill:#94a3b8;fill-opacity:0.12;stroke:#000000;stroke-width:1.2" id="seg-frame-b" />

    <ellipse cx="195" cy="56" rx="20" ry="13.5" transform="rotate(-18,195,56)"
       style="fill:#e5431e;fill-opacity:0.170391;stroke:#000000;stroke-width:3.2;stroke-linejoin:round"
       id="seg-b1" />
    <ellipse cx="241" cy="50" rx="17" ry="12" transform="rotate(22,241,50)"
       style="fill:#e5431e;fill-opacity:0.170391;stroke:#000000;stroke-width:3.2;stroke-linejoin:round"
       id="seg-b2" />
    <ellipse cx="251" cy="68" rx="17" ry="12" transform="rotate(-26,251,68)"
       style="fill:#e5431e;fill-opacity:0.170391;stroke:#000000;stroke-width:3.2;stroke-linejoin:round"
       id="seg-b3" />
    <ellipse cx="203" cy="100" rx="19" ry="13" transform="rotate(8,203,100)"
       style="fill:#e5431e;fill-opacity:0.170391;stroke:#000000;stroke-width:3.2;stroke-linejoin:round"
       id="seg-b4" />

    <!-- ══ captions ══ -->
    <text x="74" y="149" style="font-size:7px;font-family:sans-serif;text-anchor:middle;fill:#000000"
       id="seg-cap-a"><tspan x="74" y="149">Four cells, two of them</tspan><tspan x="74" y="159">touching</tspan></text>
    <text x="223" y="149" style="font-size:7px;font-family:sans-serif;text-anchor:middle;fill:#000000"
       id="seg-cap-b"><tspan x="223" y="149">Every cell gets its own outline,</tspan><tspan x="223" y="159">including the pair that touch</tspan></text>

  </g>
</svg>
