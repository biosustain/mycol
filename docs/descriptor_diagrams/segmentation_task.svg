<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="420"
   height="170"
   viewBox="0 0 420 170"
   version="1.1"
   id="svg-segmentation-task"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <g id="layer1">

    <!-- ══ panel titles ══ -->
    <text x="70" y="15" style="font-size:9px;font-family:sans-serif;text-anchor:middle;fill:#000000"
       id="seg-title-a">Input image</text>
    <text x="210" y="15" style="font-size:9px;font-family:sans-serif;text-anchor:middle;fill:#000000"
       id="seg-title-b">Foreground vs background</text>
    <text x="350" y="15" style="font-size:9px;font-family:sans-serif;text-anchor:middle;fill:#000000"
       id="seg-title-c">Instance segmentation</text>

    <!-- ══ PANEL A: the raw image ══ -->
    <rect x="10" y="24" width="120" height="104"
       style="fill:#ffffff;stroke:#000000;stroke-width:1.2" id="seg-frame-a" />

    <ellipse cx="44" cy="74" rx="19" ry="13" transform="rotate(-18,44,74)"
       style="fill:#94a3b8;fill-opacity:0.30;stroke:#000000;stroke-width:0.9" id="seg-a1" />
    <ellipse cx="86" cy="68" rx="17" ry="12" transform="rotate(22,86,68)"
       style="fill:#94a3b8;fill-opacity:0.30;stroke:#000000;stroke-width:0.9" id="seg-a2" />
    <ellipse cx="96" cy="86" rx="17" ry="12" transform="rotate(-26,96,86)"
       style="fill:#94a3b8;fill-opacity:0.30;stroke:#000000;stroke-width:0.9" id="seg-a3" />
    <ellipse cx="52" cy="118" rx="18" ry="13" transform="rotate(8,52,118)"
       style="fill:#94a3b8;fill-opacity:0.30;stroke:#000000;stroke-width:0.9" id="seg-a4" />

    <!-- ══ arrow A to B ══ -->
    <path d="M 134,76 H 143.5" style="stroke:#000000;stroke-width:1.5;fill:none" id="seg-arrow1-line" />
    <path d="M 149,76 141.5,72.6 141.5,79.4 Z" style="fill:#000000;stroke:none" id="seg-arrow1-head" />

    <!-- ══ PANEL B: a plain foreground mask, where touching cells fuse ══ -->
    <rect x="150" y="24" width="120" height="104"
       style="fill:#94a3b8;fill-opacity:0.12;stroke:#000000;stroke-width:1.2" id="seg-frame-b" />

    <!-- grouped so the overlap does not darken: the pair reads as one blob -->
    <g style="opacity:0.42" id="seg-b-blob">
      <ellipse cx="184" cy="74" rx="19" ry="13" transform="rotate(-18,184,74)"
         style="fill:#e5431e;stroke:none" id="seg-b1" />
      <ellipse cx="226" cy="68" rx="17" ry="12" transform="rotate(22,226,68)"
         style="fill:#e5431e;stroke:none" id="seg-b2" />
      <ellipse cx="236" cy="86" rx="17" ry="12" transform="rotate(-26,236,86)"
         style="fill:#e5431e;stroke:none" id="seg-b3" />
      <ellipse cx="192" cy="118" rx="18" ry="13" transform="rotate(8,192,118)"
         style="fill:#e5431e;stroke:none" id="seg-b4" />
    </g>

    <text x="238" y="44" style="font-size:6.5px;font-family:sans-serif;text-anchor:middle;fill:#000000"
       id="seg-b-note">one merged object</text>
    <path d="M 236,46.5 231,63" style="stroke:#000000;stroke-width:0.7;fill:none" id="seg-b-note-line" />

    <!-- ══ arrow B to C ══ -->
    <path d="M 274,76 H 283.5" style="stroke:#000000;stroke-width:1.5;fill:none" id="seg-arrow2-line" />
    <path d="M 289,76 281.5,72.6 281.5,79.4 Z" style="fill:#000000;stroke:none" id="seg-arrow2-head" />

    <!-- ══ PANEL C: every cell recovered as its own instance ══ -->
    <rect x="290" y="24" width="120" height="104"
       style="fill:#94a3b8;fill-opacity:0.12;stroke:#000000;stroke-width:1.2" id="seg-frame-c" />

    <ellipse cx="324" cy="74" rx="19" ry="13" transform="rotate(-18,324,74)"
       style="fill:#DC050C;fill-opacity:0.50;stroke:#000000;stroke-width:1.4" id="seg-c1" />
    <ellipse cx="366" cy="68" rx="17" ry="12" transform="rotate(22,366,68)"
       style="fill:#5289C7;fill-opacity:0.50;stroke:#000000;stroke-width:1.4" id="seg-c2" />
    <ellipse cx="376" cy="86" rx="17" ry="12" transform="rotate(-26,376,86)"
       style="fill:#4EB265;fill-opacity:0.50;stroke:#000000;stroke-width:1.4" id="seg-c3" />
    <ellipse cx="332" cy="118" rx="18" ry="13" transform="rotate(8,332,118)"
       style="fill:#F1932D;fill-opacity:0.50;stroke:#000000;stroke-width:1.4" id="seg-c4" />

    <text x="324" y="76.5" style="font-size:7px;font-family:sans-serif;text-anchor:middle;fill:#000000" id="seg-c-n1">1</text>
    <text x="358" y="64.5" style="font-size:7px;font-family:sans-serif;text-anchor:middle;fill:#000000" id="seg-c-n2">2</text>
    <text x="378" y="89" style="font-size:7px;font-family:sans-serif;text-anchor:middle;fill:#000000" id="seg-c-n3">3</text>
    <text x="332" y="120.5" style="font-size:7px;font-family:sans-serif;text-anchor:middle;fill:#000000" id="seg-c-n4">4</text>

    <!-- ══ captions ══ -->
    <text x="70" y="143" style="font-size:7px;font-family:sans-serif;text-anchor:middle;fill:#000000"
       id="seg-cap-a"><tspan x="70" y="143">Four cells, two of them</tspan><tspan x="70" y="153">touching</tspan></text>
    <text x="210" y="143" style="font-size:7px;font-family:sans-serif;text-anchor:middle;fill:#000000"
       id="seg-cap-b"><tspan x="210" y="143">Marking cell pixels alone is not</tspan><tspan x="210" y="153">enough: neighbours fuse together</tspan></text>
    <text x="350" y="143" style="font-size:7px;font-family:sans-serif;text-anchor:middle;fill:#000000"
       id="seg-cap-c"><tspan x="350" y="143">What Cellpose produces: every cell</tspan><tspan x="350" y="153">separated and counted individually</tspan></text>

  </g>
</svg>
