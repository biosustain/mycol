<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="297"
   height="172"
   viewBox="0 0 297 172"
   version="1.1"
   id="svg-classification-task"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <g id="layer1">

    <!-- ══ panel titles ══ -->
    <text x="74" y="14" style="font-size:9px;font-family:sans-serif;text-anchor:middle;fill:#000000"
       id="cls-title-a">Cells with masks</text>
    <text x="223" y="14" style="font-size:9px;font-family:sans-serif;text-anchor:middle;fill:#000000"
       id="cls-title-b">Each patch classified</text>

    <!-- ══ PANEL A: masks exist, but no cell has a class yet ══ -->
    <!-- same "masked cell" cue as the segmentation diagram: thick outline + light fill -->
    <rect x="10" y="22" width="128" height="112"
       style="fill:#94a3b8;fill-opacity:0.12;stroke:#000000;stroke-width:1.2" id="cls-frame-a" />

    <ellipse cx="46" cy="56" rx="20" ry="9" transform="rotate(-18,46,56)"
       style="fill:#e5431e;fill-opacity:0.170391;stroke:#000000;stroke-width:3.2;stroke-linejoin:round"
       id="cls-a1" />
    <ellipse cx="97" cy="52" rx="13" ry="12" transform="rotate(22,97,52)"
       style="fill:#e5431e;fill-opacity:0.170391;stroke:#000000;stroke-width:3.2;stroke-linejoin:round"
       id="cls-a2" />
    <ellipse cx="52" cy="100" rx="19" ry="9" transform="rotate(8,52,100)"
       style="fill:#e5431e;fill-opacity:0.170391;stroke:#000000;stroke-width:3.2;stroke-linejoin:round"
       id="cls-a3" />
    <ellipse cx="101" cy="96" rx="13" ry="12" transform="rotate(-14,101,96)"
       style="fill:#e5431e;fill-opacity:0.170391;stroke:#000000;stroke-width:3.2;stroke-linejoin:round"
       id="cls-a4" />

    <text x="46" y="59" style="font-size:9px;font-family:sans-serif;text-anchor:middle;fill:#000000" id="cls-a-q1">?</text>
    <text x="97" y="55" style="font-size:9px;font-family:sans-serif;text-anchor:middle;fill:#000000" id="cls-a-q2">?</text>
    <text x="52" y="103" style="font-size:9px;font-family:sans-serif;text-anchor:middle;fill:#000000" id="cls-a-q3">?</text>
    <text x="101" y="99" style="font-size:9px;font-family:sans-serif;text-anchor:middle;fill:#000000" id="cls-a-q4">?</text>

    <!-- ══ arrow ══ -->
    <path d="M 141,78 H 150.5" style="stroke:#000000;stroke-width:1.5;fill:none" id="cls-arrow-line" />
    <path d="M 156,78 148.5,74.6 148.5,81.4 Z" style="fill:#000000;stroke:none" id="cls-arrow-head" />

    <!-- ══ PANEL B: each mask cropped out and given a class ══ -->
    <!-- patch 1 -->
    <rect x="163" y="26" width="54" height="40"
       style="fill:#ffffff;stroke:#000000;stroke-width:1.1" id="cls-p1-frame" />
    <ellipse cx="190" cy="46" rx="19" ry="8" transform="rotate(-18,190,46)"
       style="fill:#5289C7;fill-opacity:0.45;stroke:#000000;stroke-width:3.2;stroke-linejoin:round"
       id="cls-p1-cell" />
    <text x="190" y="75" style="font-size:7px;font-family:sans-serif;text-anchor:middle;fill:#000000" id="cls-p1-label">Class A</text>

    <!-- patch 2 -->
    <rect x="225" y="26" width="54" height="40"
       style="fill:#ffffff;stroke:#000000;stroke-width:1.1" id="cls-p2-frame" />
    <ellipse cx="252" cy="46" rx="12" ry="11" transform="rotate(22,252,46)"
       style="fill:#4EB265;fill-opacity:0.45;stroke:#000000;stroke-width:3.2;stroke-linejoin:round"
       id="cls-p2-cell" />
    <text x="252" y="75" style="font-size:7px;font-family:sans-serif;text-anchor:middle;fill:#000000" id="cls-p2-label">Class B</text>

    <!-- patch 3 -->
    <rect x="163" y="82" width="54" height="40"
       style="fill:#ffffff;stroke:#000000;stroke-width:1.1" id="cls-p3-frame" />
    <ellipse cx="190" cy="102" rx="18" ry="8" transform="rotate(8,190,102)"
       style="fill:#5289C7;fill-opacity:0.45;stroke:#000000;stroke-width:3.2;stroke-linejoin:round"
       id="cls-p3-cell" />
    <text x="190" y="131" style="font-size:7px;font-family:sans-serif;text-anchor:middle;fill:#000000" id="cls-p3-label">Class A</text>

    <!-- patch 4 -->
    <rect x="225" y="82" width="54" height="40"
       style="fill:#ffffff;stroke:#000000;stroke-width:1.1" id="cls-p4-frame" />
    <ellipse cx="252" cy="102" rx="12" ry="11" transform="rotate(-14,252,102)"
       style="fill:#4EB265;fill-opacity:0.45;stroke:#000000;stroke-width:3.2;stroke-linejoin:round"
       id="cls-p4-cell" />
    <text x="252" y="131" style="font-size:7px;font-family:sans-serif;text-anchor:middle;fill:#000000" id="cls-p4-label">Class B</text>

    <!-- ══ captions ══ -->
    <text x="74" y="149" style="font-size:7px;font-family:sans-serif;text-anchor:middle;fill:#000000"
       id="cls-cap-a"><tspan x="74" y="149">Masks say where the cells are,</tspan><tspan x="74" y="159">not what any of them is</tspan></text>
    <text x="223" y="149" style="font-size:7px;font-family:sans-serif;text-anchor:middle;fill:#000000"
       id="cls-cap-b"><tspan x="223" y="149">Each mask is cropped out on its own</tspan><tspan x="223" y="159">and given one of your classes</tspan></text>

  </g>
</svg>
